<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="みんなでメッセージを書いて折り鶴を量産しよう！折り鶴が増えると何かが起きるかもしれない">
<title>インターネット千羽鶴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* Layout: 上にメッセージを書く紙、下に十羽ずつ糸に吊るされた鶴の束。鶴をクリックすると白い内側が開いて手紙になる */
:root {
  --bg: #eef0ee;
  --surface: #f9faf8;
  --fg: #23262b;
  --muted: #6b7068;
  --line: #d3d7d0;
  --thread: #b9a98a;
  --accent: #b8323f;
  --accent-fg: #ffffff;
  --scrim: rgba(30, 32, 28, .45);
  /* 折り紙の内側（白い面）は両テーマ共通 */
  --paper-inside: #fbfaf6;
  --paper-ink: #2a2a2a;
  --paper-crease: rgba(0,0,0,.08);
  /* 「一羽折る」の折り紙 */
  --tint: 16%;
  --fold-shade: rgba(0,0,0,.035);
  --fold-light: rgba(255,255,255,.25);
  --paper-back: #fdfcf8;
  --field: rgba(255,255,255,.75);
  --f-display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-hand: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-num: ui-monospace, "SF Mono", Menlo, monospace;
}

* { box-sizing: border-box; }
:root { color-scheme: light; }
/* ナイトモード：右下のボタンで切り替えたときだけ（端末の設定には合わせない） */
:root[data-theme="dark"] {
  --bg: #14171d; --surface: #1d2129; --fg: #e9e7e1; --muted: #9aa0a8;
  --line: #2e333d; --thread: #7d6f58; --accent: #e0606b; --accent-fg: #1a0e10;
  --scrim: rgba(0,0,0,.6); color-scheme: dark;
  --tint: 22%; --fold-shade: rgba(0,0,0,.12); --fold-light: rgba(255,255,255,.03);
  --paper-back: #d9d6cf; --field: rgba(10,12,16,.55);
}
.theme-toggle {
  position: fixed; z-index: 9;
  right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line);
  box-shadow: 0 4px 12px rgba(0,0,0,.15);
}
.theme-toggle svg { width: 20px; height: 20px; }
.theme-toggle .sun { display: none; }
:root[data-theme="dark"] .theme-toggle .sun { display: block; }
:root[data-theme="dark"] .theme-toggle .moon { display: none; }

/* 鶴が集まると何かが起きるボタン */
.event { display: grid; gap: 8px; justify-items: center; text-align: center; }
.event-btn {
  font: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
  background: var(--surface); color: var(--fg); border: 1px dashed var(--thread);
  border-radius: 4px; padding: 9px 16px;
}
/* カーソルを合わせている間は、虹色のグラデーションが流れる */
.event-btn:hover, .event-btn:focus-visible {
  color: #fff; border-color: transparent; text-shadow: 0 1px 2px rgba(0,0,0,.35);
  background: linear-gradient(90deg, #ff5f6d, #ffb347, #f9f871, #5be3a1, #4fc3f7, #a67cff, #ff5f6d) 0 0 / 300% 100%;
  animation: rainbow 2.4s linear infinite;
}
@keyframes rainbow { to { background-position: 150% 0; } }
/* スマホなどカーソルのない端末では、いつも虹色に光らせておく */
@media (hover: none) {
  .event-btn {
    color: #fff; border-color: transparent; text-shadow: 0 1px 2px rgba(0,0,0,.35);
    background: linear-gradient(90deg, #ff5f6d, #ffb347, #f9f871, #5be3a1, #4fc3f7, #a67cff, #ff5f6d) 0 0 / 300% 100%;
    animation: rainbow 2.4s linear infinite;
  }
}
.event-area { margin: 0; font-size: 13px; color: var(--muted); }
.event-area video { display: block; margin: 0 auto; width: min(100%, 480px); border-radius: 4px; background: #000; }


html, body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 15px; line-height: 1.7;
}
.wrap { max-width: 1040px; margin: 0 auto; padding: 40px 20px 80px; display: grid; gap: 36px; }

header { display: grid; gap: 14px; }
/* 10文字が画面の幅に1行で収まるように、幅に合わせて文字を小さくする */
h1 { font-family: var(--f-display); font-weight: 900; letter-spacing: .04em; font-size: clamp(18px, calc((100vw - 40px) / 10.8), 52px); white-space: nowrap; line-height: 1.2; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); }
.progress { display: grid; gap: 6px; max-width: 420px; }
.progress-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.progress-label b { font-family: var(--f-num); color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .6s ease; }

/* 書く */
/* 「一羽折る」は正方形の折り紙。選んだ色がうっすら紙に移り、
   左下の角は折り返されて白い裏が見える */
.compose {
  --pc: #c8384a;
  position: relative; padding: 26px 22px 30px; gap: 16px;
  background: var(--surface);
  background:
    linear-gradient(180deg, var(--fold-shade) 0%, rgba(0,0,0,0) 55%, var(--fold-light) 100%),
    color-mix(in srgb, var(--pc) var(--tint), var(--surface));
  border-radius: 2px;
  box-shadow: 0 1px 1px rgba(0,0,0,.08), 0 10px 24px -8px rgba(0,0,0,.18);
  transition: background-color .3s;
}
.compose::after {
  content: ""; position: absolute; left: 0; bottom: 0; width: 30px; height: 30px; pointer-events: none;
  background: linear-gradient(45deg, var(--bg) 50%, var(--paper-back) 50%);
  filter: drop-shadow(2px -2px 2px rgba(0,0,0,.12));
}
.compose input[type=text], .compose textarea { background: var(--field); }
/* 正方形の紙。中身が多い狭い画面では縦に伸びる。余った高さはメッセージ欄が使う */
.compose {
  width: min(100%, 600px); min-width: 0; justify-self: center; aspect-ratio: 1;
  display: flex; flex-direction: column;
}
.compose .msg-field { flex: 1; display: flex; flex-direction: column; }
.compose .msg-field textarea { flex: 1; }
.compose h2 { margin: 0; font-size: 16px; font-weight: 700; }
.field { display: grid; gap: 6px; }
.field label, .field .lbl { font-size: 12px; letter-spacing: .06em; color: var(--muted); }
input[type=text], textarea {
  font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; width: 100%;
}
textarea { min-height: 110px; resize: vertical; font-family: var(--f-hand); font-size: 16px; }
input:focus-visible, textarea:focus-visible, button:focus-visible, .crane:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.row { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: end; justify-content: space-between; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch {
  width: 30px; height: 30px; border-radius: 3px; border: 2px solid transparent; cursor: pointer; padding: 0;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
}
.swatch[aria-checked="true"] { border-color: var(--fg); transform: rotate(45deg) scale(.86); }
.swatch { transition: transform .2s; }
.color-name { color: var(--fg); margin-left: 6px; letter-spacing: 0; }
.swatch.custom {
  position: relative; display: grid; place-items: center; overflow: hidden;
  background: conic-gradient(#e05a35, #e9d24a, #4f9a6c, #79b4dc, #6b3f8a, #d9649a, #e05a35);
}
.swatch.custom span { font-size: 16px; line-height: 1; color: #fff; font-weight: 700; text-shadow: 0 0 3px rgba(0,0,0,.5); pointer-events: none; }
.swatch.custom.set span { display: none; }
.swatch.custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.swatch.custom:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { font-size: 12px; color: var(--muted); font-family: var(--f-num); text-align: right; }
.fold-btn {
  font: inherit; font-weight: 700; background: var(--accent); color: var(--accent-fg);
  border: 0; border-radius: 4px; padding: 11px 22px; cursor: pointer;
}
.fold-btn:disabled { opacity: .45; cursor: not-allowed; }
.status { font-size: 13px; color: var(--muted); min-height: 1.4em; margin: 0; }
/* 「鶴を折る」はどの画面幅でも紙の右下。お知らせの文が長いときは上の行に回る */
.submit-row { margin-top: auto; }
.submit-row .status { flex: 1 1 180px; min-width: 0; }
.submit-actions { display: flex; gap: 14px; align-items: center; margin-left: auto; }

/* 吊るされた鶴 */
.hang-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.hang-head h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 22px; }
.hang-head p { margin: 0; font-size: 13px; color: var(--muted); }
.rail { height: 8px; border-radius: 4px; background: var(--thread); opacity: .7; }
/* 糸の束は横に並べ、左右にスワイプ（スクロール）して見る */
.scroller {
  overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x proximity;
  padding-bottom: 10px; scrollbar-width: thin; scrollbar-color: var(--thread) transparent;
}
.hanger { width: max-content; min-width: 100%; }
.strands { display: flex; gap: 0 8px; align-items: start; margin-top: -4px; padding: 0 4px; }
.scroll-nav { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.scroll-nav .where { font-size: 12px; color: var(--muted); font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.scroll-nav .btns { display: flex; gap: 6px; }
.scroll-nav .ghost-btn { padding: 4px 12px; font-size: 13px; }
.scroll-nav .ghost-btn:disabled { opacity: .4; cursor: default; }
.strand { flex: 0 0 84px; scroll-snap-align: start; position: relative; display: grid; justify-items: center; padding-top: 10px; gap: 2px; }
.strand::before {
  content: ""; position: absolute; top: 0; bottom: 14px; left: 50%; width: 1px;
  background: var(--thread);
}
.strand::after {
  content: ""; width: 8px; height: 14px; border-radius: 0 0 4px 4px; background: var(--thread); position: relative;
}
.crane {
  position: relative; background: none; border: 0; padding: 2px 0 0; cursor: pointer;
  display: grid; justify-items: center; color: var(--muted);
  transition: transform .25s ease;
}
.crane svg { width: 64px; height: 50px; display: block; filter: drop-shadow(0 2px 2px rgba(0,0,0,.15)); }
.crane:nth-child(odd) svg { transform: scaleX(-1); }
.crane:hover { transform: translateY(-3px) rotate(-4deg); }
.crane .no {
  font-family: var(--f-num); font-size: 10px; line-height: 1; font-variant-numeric: tabular-nums;
  background: var(--bg); padding: 1px 3px; border-radius: 2px; position: relative;
}
.crane.new { animation: drop .9s cubic-bezier(.2,.9,.3,1.2); }
@keyframes drop { from { transform: translateY(-60px) scale(.3) rotate(-30deg); opacity: 0; } to { transform: none; opacity: 1; } }
.crane.ghost { cursor: default; opacity: .32; }
.crane.ghost:hover { transform: none; }
.crane.ghost svg { filter: none; }

.credit { margin: 0; padding-top: 8px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); text-align: right; letter-spacing: .04em; }
.empty {
  border: 1px dashed var(--line); border-radius: 6px; padding: 28px 20px; text-align: center; color: var(--muted);
}
.empty strong { display: block; color: var(--fg); font-weight: 500; margin-bottom: 4px; }
.demo-note { font-size: 12px; color: var(--muted); border-left: 3px solid var(--thread); padding-left: 10px; margin: 0; }

/* 開いた鶴 */
.overlay {
  position: fixed; inset: 0; background: var(--scrim); display: flex; flex-direction: column;
  padding: 20px 16px; z-index: 10; animation: fade .25s ease;
  overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
}
@keyframes fade { from { opacity: 0; } }
/* margin:auto で中央に置きつつ、手紙が画面より長いときは上から読めてスクロールできる */
.letter-wrap { margin: auto; position: relative; width: min(440px, 100%); display: grid; justify-items: center; gap: 14px; }
.fly-crane { position: absolute; top: 30%; width: 120px; pointer-events: none; animation: unfoldCrane .55s ease forwards; }
@keyframes unfoldCrane { to { transform: scale(1.8) rotate(25deg); opacity: 0; } }
.letter {
  position: relative; width: 100%; max-width: 100%; min-height: min(440px, calc(100vw - 32px));  /* 正方形が基本、長い手紙は縦に伸びる */
  background: var(--paper-inside); color: var(--paper-ink);
  border-radius: 2px; box-shadow: 0 18px 40px rgba(0,0,0,.25);
  padding: 13% 12% 12%; display: grid; grid-template-rows: auto auto 1fr auto; gap: 10px;
  animation: unfoldPaper .7s .25s cubic-bezier(.2,.8,.2,1) both;
  transform-origin: 50% 40%;
}
@keyframes unfoldPaper {
  0% { transform: scale(.15) rotate(-45deg); opacity: 0; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  55% { transform: scale(.85) rotate(-8deg); opacity: 1; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  100% { transform: none; opacity: 1; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
}
.letter .creases { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.letter .edge { position: absolute; inset: 0; border: 6px solid var(--c); opacity: .9; pointer-events: none; }
.letter .no-big { font-family: var(--f-num); font-size: 12px; letter-spacing: .1em; color: #8a857a; position: relative; }
.letter .msg {
  font-family: var(--f-hand); font-size: clamp(16px, 4.2vw, 20px); line-height: 1.75;
  white-space: pre-wrap; overflow-wrap: anywhere; position: relative;
}
.letter .photo {
  position: relative; display: block; max-width: 100%; max-height: min(190px, 34vh); justify-self: center;
  border: 4px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18); transform: rotate(-1.5deg);
}
.letter .photo-loading { position: relative; margin: 0; font-size: 13px; color: #8a857a; text-align: center; padding: 24px 0; border: 1px dashed #d8d3c8; }
.letter .from { text-align: right; font-family: var(--f-hand); font-size: 15px; color: #5d5950; position: relative; }
.letter-actions { display: flex; gap: 10px; animation: fade .3s .8s both; }
.ghost-btn {
  font: inherit; font-size: 14px; background: var(--surface); color: var(--fg);
  border: 1px solid var(--line); border-radius: 4px; padding: 8px 16px; cursor: pointer;
}

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.img-pick { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.img-pick label.ghost-btn { font-size: 14px; color: var(--fg); letter-spacing: 0; }
.img-pick:focus-within label.ghost-btn { outline: 2px solid var(--accent); outline-offset: 2px; }
.img-preview { display: flex; gap: 10px; align-items: center; }
.img-preview img { width: 64px; height: 64px; object-fit: cover; border-radius: 3px; border: 1px solid var(--line); }
.hint { font-size: 12px; color: var(--muted); }
/* 右上の赤い点は、まだひらいていない鶴 */
.crane .unread { position: absolute; top: 2px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: #e0303a; box-shadow: 0 0 0 2px var(--bg); }


@media (max-width: 520px) {
  .wrap { padding-top: 28px; }
  .strand { flex-basis: 64px; }
  .strands { gap: 0 4px; }
  .crane svg { width: 50px; height: 40px; }
}
/* 折る演出：正方形の紙 → ひし形 → 三角に二回たたむ → 鶴になって飛んでいく */
.fold-stage {
  position: fixed; inset: 0; z-index: 20; background: var(--scrim);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  animation: fade .2s ease;
}
.fold-box { position: relative; width: 180px; height: 180px; }
.fold-paper { position: absolute; inset: 0; animation: paperIn .5s cubic-bezier(.2,.8,.2,1) both, paperOut .35s 1.75s ease forwards; }
.fold-paper i { position: absolute; inset: 0; background: var(--c); }
.fold-paper .br { clip-path: polygon(50% 50%, 100% 50%, 50% 100%); }
.fold-paper .tr { clip-path: polygon(50% 0, 100% 50%, 50% 50%); animation: foldTR 1.2s .55s ease-in-out forwards; }
.fold-paper .bl { clip-path: polygon(0 50%, 50% 50%, 50% 100%); animation: foldBL 1.2s .55s ease-in-out forwards; }
.fold-paper .tl { clip-path: polygon(50% 0, 50% 50%, 0 50%); animation: foldTL 1.2s .55s ease-in-out forwards; }
/* 折り目の筋 */
.fold-paper::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, transparent calc(50% - .5px), rgba(0,0,0,.18) 50%, transparent calc(50% + .5px)),
              linear-gradient(0deg, transparent calc(50% - .5px), rgba(0,0,0,.18) 50%, transparent calc(50% + .5px));
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  animation: fade .3s .55s reverse both;
}
@keyframes paperIn { from { transform: scale(.4) rotate(45deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes paperOut { to { transform: scale(.7); opacity: 0; } }
@keyframes foldTR { 0% { transform: perspective(600px); } 45%, 100% { transform: perspective(600px) rotateX(180deg); filter: brightness(1.15); } }
@keyframes foldTL {
  0% { transform: perspective(600px); }
  45%, 55% { transform: perspective(600px) rotateX(180deg); filter: brightness(1.15); }
  100% { transform: perspective(600px) rotateY(180deg) rotateX(180deg); filter: brightness(1.05); }
}
@keyframes foldBL { 0%, 55% { transform: perspective(600px); } 100% { transform: perspective(600px) rotateY(180deg); filter: brightness(.92); } }
.fold-crane { position: absolute; inset: -10px; display: grid; place-items: center; opacity: 0; animation: craneIn .55s 1.8s cubic-bezier(.2,.9,.3,1.3) forwards; }
.fold-crane svg { width: 190px; height: 150px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.3)); }
@keyframes craneIn { from { opacity: 0; transform: scale(.4) rotate(-20deg); } to { opacity: 1; transform: none; } }
.fold-stage.flying .fold-crane { opacity: 1; animation: craneFly .9s cubic-bezier(.5,0,.7,.4) forwards; }
@keyframes craneFly {
  0% { transform: none; }
  25% { transform: translate(-10px, 12px) rotate(4deg); }
  100% { transform: translate(38vw, -60vh) scale(.25) rotate(-18deg); opacity: 0; }
}
.fold-label { margin: 0; color: #fff; font-weight: 700; font-size: 16px; letter-spacing: .06em; text-shadow: 0 1px 4px rgba(0,0,0,.4); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition: none !important; }
}
</style>
<script>
  // 前回選んだナイトモードを、表示の前に反映する
  try { if (localStorage.getItem("senbazuru-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}
</script>
</head>
<body>

<div class="wrap">
  <header>
    <h1>インターネット千羽鶴</h1>
    <div class="progress" aria-live="polite">
      <div class="progress-label"><span>いま <b id="n-count">0</b> 羽</span><span>のこり <b id="n-left">1000</b> 羽</span></div>
      <div class="bar"><span id="bar"></span></div>
    </div>
    <p class="lede">メッセージを書くと鶴が一羽折れます。</p>
  </header>

  <form class="compose" id="compose" autocomplete="off">
    <h2>一羽折る</h2>
    <div class="field msg-field">
      <label for="msg">メッセージ(~300字)</label>
      <textarea id="msg" maxlength="300" placeholder="例：また一緒に遊ぼう！" required></textarea>
    </div>
    <div class="row">
      <div class="field" style="flex:1 1 200px; min-width:0">
        <label for="from">名前（空欄は匿名）</label>
        <input type="text" id="from" maxlength="30" placeholder="匿名">
      </div>
    </div>
    <div class="field">
      <span class="lbl" id="color-lbl">折り紙の色 <span class="color-name" id="color-name">紅</span></span>
      <div class="swatches" id="swatches" role="radiogroup" aria-labelledby="color-lbl">
      </div>
    </div>
    <div class="field">
      <span class="lbl">画像（任意）</span>
      <div class="img-pick">
        <label class="ghost-btn" for="img">画像をえらぶ</label>
        <input type="file" id="img" accept="image/*" class="sr-only">
        <div class="img-preview" id="img-preview" hidden>
          <img id="img-thumb" alt="添付する画像のプレビュー">
          <button type="button" class="ghost-btn" id="img-clear">はずす</button>
        </div>

(() => {
  const GOAL = 1000, PER_STRAND = 10;
  const COLORS = [

    { id: "sango", name: "珊瑚", hex: "#f08a7a" },

    { id: "remon", name: "レモン", hex: "#e9d24a" },
    { id: "moegi", name: "萌黄", hex: "#a2c048" },
    { id: "wakatake", name: "若竹", hex: "#4f9a6c" },
    { id: "seiji", name: "青磁", hex: "#7fb5a6" },
    { id: "mizu", name: "水色", hex: "#79b4dc" },
    { id: "ruri", name: "瑠璃", hex: "#2f5d9e" },
    { id: "kon", name: "紺", hex: "#22386a" },
    { id: "fuji", name: "藤", hex: "#a08cc8" },
    { id: "murasaki", name: "紫", hex: "#6b3f8a" },
    { id: "cha", name: "茶", hex: "#8b5a3c" },
    { id: "sumi", name: "墨", hex: "#3a3a3e" },
    { id: "shiro", name: "白", hex: "#f4f2ec" },
    { id: "kogane", name: "金", hex: "#c9a64a" },
    { id: "gin", name: "銀", hex: "#b4b9c0" },
  ];
  // 色は基本色の id か、自分で選んだ "#rrggbb"。共有データは信用せず形を確かめる
  const colorHex = v => {

  const $ = id => document.getElementById(id);
  let cranes = [];       // {n, msg, from, color}
  let db = null;         // Firestore。設定前（お試し）は null
  let picked = COLORS[0].id;
  let openIdx = -1;
  let justFolded = null;

  // 鶴の形（横から見た折り鶴）。羽は上に立ち、左に首と折れた頭、右に尾。紙の色にかげを重ねて立体に見せる
  function craneSVG(hex) {
    return `<svg viewBox="0 0 100 78" aria-hidden="true">
      <polygon points="54,46 69,4 66,48" fill="${hex}"/>
      <polygon points="54,46 69,4 66,48" fill="#000" opacity=".28"/>
      <polygon points="62,50 83,11 86,13 68,52" fill="${hex}"/>
      <polygon points="62,50 83,11 86,13 68,52" fill="#000" opacity=".1"/>
      <polygon points="35,52 19,19 23,19 42,50" fill="${hex}"/>
      <polygon points="19,19 23,19 8,27" fill="${hex}"/>
      <polygon points="19,19 23,19 8,27" fill="#000" opacity=".15"/>
      <polygon points="35,52 50,43 67,50 52,75" fill="${hex}"/>
      <polygon points="50,43 67,50 52,75" fill="#000" opacity=".14"/>
      <polygon points="42,48 60,1 61,46" fill="${hex}"/>
      <polygon points="42,48 60,1 61,46" fill="#fff" opacity=".14"/>
      <polyline points="60,1 61,46" stroke="#000" stroke-opacity=".12" stroke-width=".6" fill="none"/>
    </svg>`;
  }
  const pad = n => String(n).padStart(4, "0");

  // 色えらび：基本色＋「自分で選ぶ」
  function select(el, value, name) {
    picked = value;
    $("compose").style.setProperty("--pc", colorHex(value));
    $("color-name").textContent = name;
    document.querySelectorAll(".swatch").forEach(s => s.setAttribute("aria-checked", s === el));
  }
  COLORS.forEach(c => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "swatch"; b.style.background = c.hex;
    b.setAttribute("role", "radio"); b.setAttribute("aria-label", c.name); b.title = c.name;
    b.setAttribute("aria-checked", c.id === picked);
    b.onclick = () => select(b, c.id, c.name);
    $("swatches").appendChild(b);
  });
  const custom = document.createElement("label");
  custom.className = "swatch custom"; custom.title = "自分で選ぶ";
  custom.setAttribute("role", "radio"); custom.setAttribute("aria-checked", "false");
  custom.innerHTML = '<input type="color" id="custom-color" value="#5fb3a1" aria-label="自分で色を選ぶ"><span>＋</span>';
  $("swatches").appendChild(custom);
  const cc = custom.querySelector("input");
  const useCustom = () => {
    custom.style.background = cc.value; custom.classList.add("set");
    select(custom, cc.value.toLowerCase(), "自分で選んだ色 " + cc.value.toLowerCase());
  };
  cc.addEventListener("input", useCustom);
  cc.addEventListener("click", () => { if (custom.classList.contains("set")) useCustom(); });

  $("msg").addEventListener("input", () => {
    $("charcount").textContent = `${$("msg").value.length} / 300`;
  });

  function render() {
    const total = cranes.length;
    $("n-count").textContent = total;
    $("n-left").textContent = Math.max(0, GOAL - total);
    $("bar").style.width = Math.min(100, total / GOAL * 100) + "%";
    $("empty").hidden = total > 0;

    const box = $("strands");
    box.innerHTML = "";
    if (!total) return;
    // 最後の糸の残りは、これから折られる鶴の場所として薄く見せる
    const slots = Math.ceil(total / PER_STRAND) * PER_STRAND;
    let strand;
    for (let i = 0; i < slots; i++) {
      if (i % PER_STRAND === 0) {
        strand = document.createElement("div");
        strand.className = "strand";
        box.appendChild(strand);
      }
      const c = cranes[i];
      const el = document.createElement("button");
      el.type = "button";
      if (c) {
        el.className = "crane" + (c.n === justFolded ? " new" : "");
        el.dataset.n = c.n;
        const unread = !readSet.has(c.n);
        el.innerHTML = craneSVG(colorHex(c.color)) + `<span class="no">${pad(c.n)}</span>`
          + (unread ? '<span class="unread"></span>' : "");
        el.setAttribute("aria-label", `No.${pad(c.n)} の鶴をひらく` + (unread ? "（まだ読んでいません）" : ""));
        el.onclick = () => openLetter(i);
      } else {
        el.className = "crane ghost"; el.disabled = true; el.tabIndex = -1;
        el.innerHTML = craneSVG("#9a9a9a") + `<span class="no">${pad(i + 1)}</span>`;
        el.setAttribute("aria-hidden", "true");
      }
      strand.appendChild(el);
    }
    $("scroll-nav").hidden = false;
    if (justFolded != null) showCrane(justFolded);
    justFolded = null;
    updateWhere();
  }

  // 横スクロールの位置表示と移動ボタン
  const scroller = $("scroller");
  function updateWhere() {
    const strands = $("strands").children;
    if (!strands.length) return;
    const w = strands[0].getBoundingClientRect().width + 8;
    const first = Math.min(strands.length, Math.floor(scroller.scrollLeft / w) + 1);
    const last = Math.min(strands.length, Math.floor((scroller.scrollLeft + scroller.clientWidth) / w));
    $("where").textContent = `糸 ${first}〜${Math.max(first, last)} 本目 / 全 ${strands.length} 本`;
    const atStart = scroller.scrollLeft <= 2;
    const atEnd = scroller.scrollLeft + scroller.clientWidth >= scroller.scrollWidth - 2;
    $("to-first").disabled = $("to-left").disabled = atStart;
    $("to-last").disabled = $("to-right").disabled = atEnd;
  }
  function showCrane(n) {
    const el = $("strands").querySelector(`[data-n="${n}"]`);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
  }
  scroller.addEventListener("scroll", updateWhere, { passive: true });
  window.addEventListener("resize", updateWhere);
  const page = () => Math.max(100, scroller.clientWidth * 0.8);
  $("to-left").onclick = () => scroller.scrollBy({ left: -page(), behavior: "smooth" });
  $("to-right").onclick = () => scroller.scrollBy({ left: page(), behavior: "smooth" });
  $("to-first").onclick = () => scroller.scrollTo({ left: 0, behavior: "smooth" });
  $("to-last").onclick = () => scroller.scrollTo({ left: scroller.scrollWidth, behavior: "smooth" });

  // 読んだ鶴の番号は、この端末のブラウザにだけ覚えておく（Firebase は使わないので無料の範囲に影響しない）
  const READ_KEY = "senbazuru-read";
  let persistRead = true;
  const readSet = new Set();
  try { JSON.parse(localStorage.getItem(READ_KEY) || "[]").forEach(n => typeof n === "number" && readSet.add(n)); } catch {}
  function markRead(n) {
    if (readSet.has(n)) return;
    readSet.add(n);
    if (persistRead) try { localStorage.setItem(READ_KEY, JSON.stringify([...readSet])); } catch {}
    const el = $("strands").querySelector(`[data-n="${n}"]`);
    if (el) { el.querySelector(".unread")?.remove(); el.setAttribute("aria-label", `No.${pad(n)} の鶴をひらく`); }
  }

  function openLetter(i) {
    openIdx = i;
    const c = cranes[i];
    markRead(c.n);
    const ov = $("overlay");
    ov.hidden = true; void ov.offsetWidth; // アニメーションを毎回やり直す
    ov.querySelector(".fly-crane")?.remove();
    const fly = document.createElement("div");
    fly.className = "fly-crane"; fly.innerHTML = craneSVG(colorHex(c.color));
    ov.querySelector(".letter-wrap").prepend(fly);
    $("letter").style.setProperty("--c", colorHex(c.color));
    $("letter-no").textContent = `No.${pad(c.n)}`;
    $("letter-msg").textContent = c.msg;
    showPhoto(null);
    if (c.img) showPhoto(c.img, c.n);   // 以前の形（鶴と一緒に保存した画像）とお試し表示
    else if (c.hasImg && db) {
      $("img-loading").hidden = false;
      loadImage(c.n).then(src => {
        if (cranes[openIdx] !== c) return;   // 読み込み中に別の鶴へ移った
        $("img-loading").hidden = true;
        if (src) showPhoto(src, c.n);
        else { $("img-loading").textContent = "画像を読み込めませんでした。"; $("img-loading").hidden = false; }
      });
    }
    $("letter-from").textContent = "— " + (c.from || "匿名");
    $("prev").disabled = i === 0;
    $("next").disabled = i === cranes.length - 1;
    ov.hidden = false; ov.scrollTop = 0;
    document.body.style.overflow = "hidden";
    $("close").focus();
  }
  function showPhoto(src, n) {
    const li = $("letter-img");
    $("img-loading").hidden = true;
    $("img-loading").textContent = "画像を読み込んでいます…";
    if (typeof src === "string" && src.startsWith("data:image/")) {
      li.src = src; li.alt = `No.${pad(n)} に添えられた画像`; li.hidden = false;
    } else { li.removeAttribute("src"); li.hidden = true; }
  }
  // 画像は鶴をひらいたときに1枚だけ読み込む（一度読んだものは覚えておく）
  const imageCache = new Map();
  function loadImage(n) {
    if (!imageCache.has(n)) {
      imageCache.set(n, getDoc(doc(db, "images", String(n)))
        .then(snap => snap.exists() ? snap.data().img : null)
        .catch(err => { console.error(err); imageCache.delete(n); return null; }));
    }
    return imageCache.get(n);
  }
  function closeLetter() { $("overlay").hidden = true; openIdx = -1; document.body.style.overflow = ""; }
  $("close").onclick = closeLetter;
  $("prev").onclick = () => openIdx > 0 && openLetter(openIdx - 1);
  $("next").onclick = () => openIdx < cranes.length - 1 && openLetter(openIdx + 1);
  $("overlay").addEventListener("click", e => { if (e.target === $("overlay")) closeLetter(); });
  document.addEventListener("keydown", e => {
    if ($("overlay").hidden) return;
    if (e.key === "Escape") closeLetter();
    if (e.key === "ArrowLeft") $("prev").click();
    if (e.key === "ArrowRight") $("next").click();
  });

  // 画像：長い辺を 720px までに縮めて JPEG にし、鶴と一緒に保存する
  let pickedImg = null;
  function clearImg() {
    pickedImg = null; $("img").value = "";
    $("img-preview").hidden = true; $("img-thumb").removeAttribute("src");
    $("img-hint").textContent = "写真やイラスト1枚まで";
  }
  function shrink(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const im = new Image();
      im.onload = () => {
        const MAX = 720, k = Math.min(1, MAX / Math.max(im.width, im.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
        const ctx = cv.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.drawImage(im, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        // 保存できる大きさ（約 45 万文字）に収まるまで画質を下げる
        let q = 0.8, out = cv.toDataURL("image/jpeg", q);
        while (out.length > 450000 && q > 0.35) { q -= 0.1; out = cv.toDataURL("image/jpeg", q); }
        out.length > 450000 ? reject(new Error("too big")) : resolve(out);
      };
      im.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
      im.src = url;
    });
  }
  $("img").addEventListener("change", async () => {
    const f = $("img").files[0];
    if (!f) return;
    try {
      pickedImg = await shrink(f);
      $("img-thumb").src = pickedImg;
      $("img-preview").hidden = false;
      $("img-hint").textContent = f.name;
    } catch {
      clearImg();
      $("img-hint").textContent = "この画像は読み込めませんでした。JPEG や PNG を選んでください。";
    }
  });
  $("img-clear").onclick = clearImg;

  // 折る演出。紙がたたまれて鶴になるまで約2.3秒、そのあと飛んでいく
  const wait = ms => new Promise(r => setTimeout(r, ms));
  function playFold(hex) {
    const st = $("fold-stage");
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
      return { formed: Promise.resolve(), fly: async () => {}, cancel() {} };
    }
    st.style.setProperty("--c", hex);
    $("fold-crane").innerHTML = craneSVG(hex);
    $("fold-label").textContent = "折っています…";
    st.classList.remove("flying");
    st.hidden = true; void st.offsetWidth; st.hidden = false;   // アニメーションを最初から
    document.body.style.overflow = "hidden";
    const close = () => { st.hidden = true; st.classList.remove("flying"); document.body.style.overflow = ""; };
    return {
      formed: wait(2400),
      async fly(label) {
        $("fold-label").textContent = label;
        await wait(500);
        st.classList.add("flying");
        await wait(900);
        close();
      },
      cancel: close,
    };
  }

  // 折る
  $("compose").addEventListener("submit", async e => {
    e.preventDefault();
    const msg = $("msg").value.trim();
    if (!msg) { $("status").textContent = "メッセージを書いてから折ってください。"; return; }
    const from = $("from").value.trim();
    $("fold").disabled = true;
    $("status").textContent = "折っています…";
    const anim = playFold(colorHex(picked));
    try {
      const saving = db ? foldShared(msg, from, picked, pickedImg) : Promise.resolve(foldLocal(msg, from, picked, pickedImg));
      const [n] = await Promise.all([saving, anim.formed]);
      markRead(n);   // 自分で折った鶴は読んだことにする
      await anim.fly(`No.${pad(n)} の鶴ができました`);
      if (!db) render();
      const el = $("strands").querySelector(`[data-n="${n}"]`);
      if (el) { el.classList.remove("new"); void el.offsetWidth; el.classList.add("new"); showCrane(n); }
      $("msg").value = ""; $("charcount").textContent = "0 / 300"; clearImg();
      $("status").textContent = `No.${pad(n)} の鶴を折りました。ありがとう！`;
    } catch (err) {
      console.error(err);
      anim.cancel();
      $("status").textContent = err && err.code === "permission-denied"
        ? "保存が断られました。メッセージは300字まで、名前は30字までにしてもう一度押してください。"
        : "うまく折れませんでした。少し待ってからもう一度押してください。";
    } finally {
      $("fold").disabled = false;
    }
  });

  // 保存の形：
  //   meta/counter         … いままでに折られた数
  //   books/{0,1,2…}       … 鶴100羽ずつを1つにまとめた束（文字だけ）。ページを開くとこれだけ読む
  //   images/{番号}        … 画像。その鶴をひらいたときだけ読む
  // 番号は counter を1増やして決める。同時に誰かが折った場合は Firebase が自動でやり直すので重ならない
  const bookOf = n => String(Math.floor((n - 1) / 100));
  async function foldShared(msg, from, color, img) {
    const counterRef = doc(db, "meta", "counter");
    const n = await runTransaction(db, async tx => {
      const snap = await tx.get(counterRef);
      const n = (snap.exists() ? snap.data().count : 0) + 1;
      const crane = { n, msg, from, color, hasImg: !!img, at: serverTimestamp() };
      tx.set(counterRef, { count: n });
      tx.set(doc(db, "books", bookOf(n)), { c: { [String(n)]: crane } }, { merge: true });
      if (img) tx.set(doc(db, "images", String(n)), { img });
      return n;
    });
    if (img) imageCache.set(n, Promise.resolve(img));
    return n;
  }

  // お試しモード（firebaseConfig を貼る前）
  const LS_KEY = "senbazuru-demo";
  const SAMPLES = [
    { msg: "いつも配信楽しみにしてます。今はしっかり休んでね。", from: "みかん", color: "yamabuki" },
    { msg: "焦らなくて大丈夫。戻ってくる場所はちゃんとあるよ。", from: "", color: "ruri" },
    { msg: "元気になったらまた夜通しゲームしよう！", from: "tsukasa", color: "beni" },
    { msg: "あなたの言葉にたくさん救われてきました。今度はこちらが応援する番です。", from: "ふじ", color: "fuji" },
    { msg: "ごはん食べて、あったかくして寝てね。", from: "", color: "sakura" },
    { msg: "千羽そろうまでみんなで折ります。", from: "Leo", color: "wakatake" },
    { msg: "待ってるよ〜！", from: "ぽん", color: "kogane" },
  ];
  let keepLocal = true;   // #demo のダミー表示では、折った鶴を残さない
  function foldLocal(msg, from, color, img) {
    const n = cranes.length + 1;
    cranes.push({ n, msg, from, color, img: img || undefined, mine: true });
    if (keepLocal) try { localStorage.setItem(LS_KEY, JSON.stringify(cranes.filter(c => c.mine))); } catch {}
    return n;
  }
  function startDemo() {
    $("demo-note").hidden = false;
    cranes = SAMPLES.map((s, i) => ({ n: i + 1, ...s }));
    try {
      const mine = JSON.parse(localStorage.getItem(LS_KEY) || "[]");
      mine.forEach(m => cranes.push({ ...m, n: cranes.length + 1, mine: true }));
    } catch {}
    render();
  }
  // URL の最後に #demo をつけると、ダミーの鶴100羽で見た目を確かめられる（本物のデータには触れない）
  function startDummy(count) {
    keepLocal = false;
    persistRead = false;   // ダミーの番号を、本物の既読として残さない
    readSet.clear();
    $("demo-note").textContent = `ダミー表示です（URL の #demo）。鶴${count}羽は見本で、本物の鶴は表示していません。ここで折った鶴はどこにも保存されません。`;
    $("demo-note").hidden = false;
    let seed = 7;
    const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    cranes = Array.from({ length: count }, (_, i) => {
      const s = SAMPLES[i % SAMPLES.length];
      const r = rand();
      const color = r < .1 ? "#" + Math.floor(rand() * 0xffffff).toString(16).padStart(6, "0") : COLORS[Math.floor(r * COLORS.length)].id;
      return { n: i + 1, msg: s.msg, from: s.from, color };
    });
    render();
  }
  window.addEventListener("hashchange", () => location.reload());

  // 起動
  render();
  const configured = firebaseConfig.projectId && !firebaseConfig.apiKey.startsWith("ここに");
  if (location.hash === "#demo") { startDummy(100); return; }
  if (!configured) { startDemo(); return; }
  try {
    db = getFirestore(initializeApp(firebaseConfig));
  } catch (err) {
    console.error(err);
    $("status").textContent = "Firebase の設定が読めませんでした。firebaseConfig の貼り付けを確認してください。";
    return;
  }
  // 束（books）と、以前の形で保存された鶴（cranes）を合わせて番号順に並べる
  let fromBooks = [], legacy = [];
  const valid = c => c && typeof c.n === "number" && typeof c.msg === "string";
  const merge = () => {
    const byN = new Map();
    [...legacy, ...fromBooks].forEach(c => byN.set(c.n, c));
    cranes = [...byN.values()].sort((a, b) => a.n - b.n);
    render();
  };
  const onErr = err => {
    console.error(err);
    $("status").textContent = "鶴を読み込めませんでした。ページを開き直してください。";
  };
  onSnapshot(collection(db, "books"), snap => {
    fromBooks = snap.docs.flatMap(d => Object.values(d.data().c || {})).filter(valid);
    merge();
  }, onErr);
  onSnapshot(collection(db, "cranes"), snap => {
    legacy = snap.docs.map(d => d.data()).filter(valid);
    merge();
  }, onErr);
})();
</script>
</body>
</html>
